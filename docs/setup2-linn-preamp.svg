<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a6a8a"/>
    </marker>
    <marker id="arrowSerial" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b07d2a"/>
    </marker>
    <linearGradient id="piGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9685b"/><stop offset="1" stop-color="#a94e42"/>
    </linearGradient>
    <linearGradient id="dacGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8ac9"/><stop offset="1" stop-color="#3d6aa0"/>
    </linearGradient>
    <linearGradient id="ampGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a9b5b"/><stop offset="1" stop-color="#4c7a3f"/>
    </linearGradient>
    <linearGradient id="preampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6ab0"/><stop offset="1" stop-color="#6a4d8f"/>
    </linearGradient>
    <linearGradient id="serialGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b25f"/><stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Setup 2 — Raspdac Mini / OLED with Linn preamplifier (RA2) over RS232</text>

  <!-- Audio path -->
  <rect x="20" y="70" width="150" height="90" rx="8" fill="url(#piGrad2)" stroke="#8a3d33"/>
  <text x="95" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Raspberry Pi 4</text>
  <text x="95" y="128" text-anchor="middle" font-size="11" fill="#eee">ohPlayer</text>
  <text x="95" y="145" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">DAC output @ full scale</text>

  <rect x="260" y="70" width="190" height="90" rx="8" fill="url(#dacGrad2)" stroke="#2d5580"/>
  <text x="355" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Raspdac DAC</text>
  <text x="355" y="120" text-anchor="middle" font-size="11" fill="#eee">ES9038Q2M</text>
  <text x="355" y="140" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">Mini / OLED</text>

  <rect x="540" y="70" width="160" height="90" rx="8" fill="url(#preampGrad)" stroke="#553c73"/>
  <text x="620" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Linn preamp</text>
  <text x="620" y="120" text-anchor="middle" font-size="12" fill="#eee">RA2</text>
  <text x="620" y="140" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">volume • balance • bass • treble</text>

  <rect x="760" y="85" width="80" height="60" rx="6" fill="#777" stroke="#555"/>
  <text x="800" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Speakers</text>

  <line x1="170" y1="115" x2="258" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="214" y="103" text-anchor="middle" font-size="11" fill="#4a6a8a" font-weight="bold">I2S</text>
  <line x1="450" y1="115" x2="538" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="494" y="103" text-anchor="middle" font-size="11" fill="#4a6a8a" font-weight="bold">RCA</text>
  <line x1="700" y1="115" x2="758" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="729" y="103" text-anchor="middle" font-size="10" fill="#4a6a8a" font-weight="bold">zone out</text>

  <!-- Control path -->
  <rect x="20" y="250" width="170" height="70" rx="8" fill="url(#serialGrad)" stroke="#8f6a20"/>
  <text x="105" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">USB-RS232 adapter</text>
  <text x="105" y="300" text-anchor="middle" font-size="11" fill="#fff">/dev/ttyUSB0</text>

  <rect x="520" y="250" width="180" height="70" rx="8" fill="url(#preampGrad)" stroke="#553c73"/>
  <text x="610" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">RA2 control port</text>
  <text x="610" y="300" text-anchor="middle" font-size="11" fill="#eee">9600 bauds, 7E1</text>

  <!-- vertical from Pi down, horizontal to adapter, arrow -->
  <line x1="95" y1="160" x2="95" y2="285" stroke="#b07d2a" stroke-width="2"/>
  <line x1="95" y1="285" x2="188" y2="285" stroke="#b07d2a" stroke-width="2" marker-end="url(#arrowSerial)"/>
  <text x="105" y="205" font-size="11" fill="#b07d2a" font-weight="bold">USB</text>

  <line x1="190" y1="285" x2="518" y2="285" stroke="#b07d2a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowSerial)"/>
  <text x="354" y="273" text-anchor="middle" font-size="11" fill="#b07d2a" font-weight="bold">RS232</text>

  <!-- vertical from RA2 port up to preamp -->
  <line x1="620" y1="250" x2="620" y2="168" stroke="#b07d2a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowSerial)"/>
  <text x="628" y="215" font-size="11" fill="#b07d2a" font-weight="bold">control</text>

  <!-- Protocol commands box -->
  <rect x="230" y="345" width="420" height="60" rx="6" fill="#fdf6e3" stroke="#d9b25f"/>
  <text x="440" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f6a20">$VOL = n$  •  $BAL = n$  •  $BAS = n$  •  $TRB = n$</text>
  <text x="440" y="385" text-anchor="middle" font-size="11" fill="#8f6a20">$STANDBY ON/OFF$  •  $LISTEN 1$  •  $ID ?$</text>

  <!-- Settings note -->
  <rect x="20" y="345" width="190" height="60" rx="6" fill="#f5f8fa" stroke="#c8d4dc"/>
  <text x="35" y="365" font-size="11" font-weight="bold" fill="#2d5580">Web UI — Linn Amp tab:</text>
  <text x="35" y="382" font-size="10" fill="#333">Volume Control: “Linn amplifier”</text>
  <text x="35" y="396" font-size="10" fill="#333">Serial: /dev/ttyUSB0 • Bass/Treble ±7</text>
</svg>
