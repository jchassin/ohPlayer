<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f4fd"/><stop offset="1" stop-color="#c9e7fb"/>
    </linearGradient>
    <linearGradient id="encbuf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3e0"/><stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="codec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e5f5"/><stop offset="1" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="sramper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="alsa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fce4ec"/><stop offset="1" stop-color="#f8bbd0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b1fa2"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#fafafa" rx="12"/>

  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#263238">ohPlayer audio chain — buffers and latency (Songcast receiver)</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#607d8b">Pull flow: the output sets the pace. The sender announces a media latency target (150 ms DS / 300 ms ohPlayer) that the pipeline compensates for.</text>

  <!-- SENDER -->
  <rect x="30" y="105" width="185" height="240" rx="10" fill="#eceff1"/>
  <text x="122" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">SENDER</text>
  <text x="122" y="145" text-anchor="middle" font-size="10" fill="#78909c">(Linn DS)</text>

  <rect x="45" y="165" width="155" height="78" rx="8" fill="url(#net)" stroke="#81d4fa"/>
  <text x="122" y="193" text-anchor="middle" font-size="12.5" font-weight="600" fill="#01579b">Linn DS (sender)</text>
  <text x="122" y="210" text-anchor="middle" font-size="10" fill="#0277bd">ohm/ohu Unicast</text>
  <text x="122" y="226" text-anchor="middle" font-size="10" fill="#0277bd">own latency: ~150 ms</text>

  <rect x="45" y="262" width="155" height="64" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="122" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e65100">announced target: 150 ms</text>
  <text x="122" y="300" text-anchor="middle" font-size="9.5" fill="#ef6c00">MediaLatency in every packet</text>
  <text x="122" y="314" text-anchor="middle" font-size="9.5" fill="#ef6c00">→ injected as MsgDelay</text>

  <!-- DS audio output: speaker circle, same style as the renderer DAC -->
  <circle cx="122" cy="240" r="34" fill="#fff8e1" stroke="#ffca28" stroke-width="2"/>
  <text x="122" y="234" text-anchor="middle" font-size="16">&#9834;</text>
  <text x="122" y="254" text-anchor="middle" font-size="9.5" font-weight="600" fill="#f57f17">DS speakers</text>

  <!-- inter room delay arrow: from the DS audio output to the renderer DAC output -->
  <path d="M 122 280 C 200 345, 950 345, 1078 292"
        fill="none" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="9,6" marker-end="url(#arrowViolet)"/>
  <text x="600" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b1fa2">inter room delay</text>

  <!-- RECEIVER -->
  <rect x="240" y="105" width="935" height="240" rx="10" fill="none" stroke="#b0bec5" stroke-dasharray="5,4"/>
  <text x="705" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">RENDERER ohPlayer — ohPipeline</text>

  <!-- Encoded Reservoir -->
  <rect x="262" y="160" width="200" height="160" rx="8" fill="url(#encbuf)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="362" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Encoded Reservoir</text>
  <text x="362" y="206" text-anchor="middle" font-size="10.5" fill="#ef6c00">ENCODED audio — upstream</text>
  <rect x="276" y="220" width="172" height="52" rx="4" fill="#ffffff" opacity="0.65"/>
  <rect x="276" y="220" width="155" height="52" rx="4" fill="#ff9800" opacity="0.45"/>
  <text x="362" y="241" text-anchor="middle" font-size="10" fill="#bf360c">~8 s network headroom</text>
  <text x="362" y="256" text-anchor="middle" font-size="10" fill="#bf360c">(1.5 MB PCM 48k/16)</text>
  <text x="362" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">latency: 0 ms — free</text>
  <text x="362" y="310" text-anchor="middle" font-size="10" fill="#ef6c00">configui: EncodedReservoirSize</text>

  <!-- Codec -->
  <rect x="492" y="160" width="160" height="160" rx="8" fill="url(#codec)" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="572" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#6a1b9a">Codec</text>
  <text x="572" y="208" text-anchor="middle" font-size="10.5" fill="#7b1fa2">Flac - Mp3 - Pcm - Aac</text>
  <text x="572" y="240" text-anchor="middle" font-size="10" fill="#7b1fa2">consums at the pace</text>
  <text x="572" y="255" text-anchor="middle" font-size="10" fill="#7b1fa2">of the output (pull)</text>
  <text x="572" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">latency: ~0 ms</text>

  <!-- Starvation Ramper -->
  <rect x="682" y="160" width="215" height="160" rx="8" fill="url(#sramper)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="789" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Starvation Ramper</text>
  <text x="789" y="206" text-anchor="middle" font-size="10.5" fill="#2e7d32">DECODED audio — downstream</text>
  <rect x="696" y="218" width="187" height="54" rx="4" fill="#ffffff" opacity="0.65"/>
  <rect x="696" y="218" width="93" height="54" rx="4" fill="#66bb6a" opacity="0.55"/>
  <text x="789" y="240" text-anchor="middle" font-size="10" fill="#1b5e20">floor = 100 ms (current)</text>
  <text x="789" y="256" text-anchor="middle" font-size="10" fill="#1b5e20">max allowed: 280 ms</text>
  <text x="789" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#c62828">downstream latency (part 1)</text>
  <text x="789" y="310" text-anchor="middle" font-size="10" fill="#2e7d32">configui: StarvationRamperMinSize</text>

  <!-- ALSA -->
  <rect x="927" y="160" width="130" height="160" rx="8" fill="url(#alsa)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="992" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#880e4f">ALSA buffer</text>
  <text x="992" y="206" text-anchor="middle" font-size="10.5" fill="#ad1457">DriverAlsa to DAC</text>
  <rect x="941" y="222" width="102" height="44" rx="4" fill="#ec407a" opacity="0.4"/>
  <text x="992" y="240" text-anchor="middle" font-size="10" fill="#880e4f">kept full</text>
  <text x="992" y="256" text-anchor="middle" font-size="10" fill="#880e4f">12 ms (incl. I2S fifo)</text>
  <text x="992" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#c2185b">downstream latency (part 2)</text>
  <text x="992" y="310" text-anchor="middle" font-size="9.5" fill="#ad1457">configui: AlsaBufferUs</text>

  <!-- output -->
  <circle cx="1118" cy="240" r="46" fill="#fff8e1" stroke="#ffca28" stroke-width="2"/>
  <text x="1118" y="232" text-anchor="middle" font-size="20">&#9834;</text>
  <text x="1118" y="254" text-anchor="middle" font-size="10.5" font-weight="600" fill="#f57f17">DAC + speakers</text>
  <text x="1118" y="268" text-anchor="middle" font-size="9" fill="#f9a825">ES9038Q2M - ~1 ms, cancels out</text>

  <!-- arrows -->
  <line x1="200" y1="240" x2="258" y2="240" stroke="#546e7a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="462" y1="240" x2="488" y2="240" stroke="#546e7a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="652" y1="240" x2="678" y2="240" stroke="#546e7a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="897" y1="240" x2="923" y2="240" stroke="#546e7a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="1057" y1="240" x2="1068" y2="240" stroke="#546e7a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <line x1="1068" y1="392" x2="262" y2="392" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arrowBlue)"/>
  <text x="665" y="412" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1976d2">pull: the output sets the pace, upstream follows</text>

  <!-- downstream band -->
  <line x1="682" y1="322" x2="682" y2="420" stroke="#e57373" stroke-width="1.5"/>
  <line x1="1057" y1="322" x2="1057" y2="420" stroke="#e57373" stroke-width="1.5"/>
  <rect x="682" y="420" width="375" height="30" rx="5" fill="#ffebee" stroke="#ef9a9a"/>
  <text x="869" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">downstream: ramper + ALSA — keep below the sender target</text>

  <!-- rules box -->
  <rect x="30" y="480" width="1140" height="195" rx="10" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="600" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Multiroom alignment — how the offset is governed</text>

  <rect x="70" y="535" width="18" height="18" rx="4" fill="#ffb74d"/>
  <text x="100" y="549" font-size="12.5" font-weight="700" fill="#e65100">SENDER TARGET: announced in every packet (MsgDelay) — 150 ms from a Linn DS,</text>
  <text x="100" y="566" font-size="12.5" font-weight="700" fill="#e65100">300 ms from an ohPlayer sender</text>
  <text x="100" y="587" font-size="11.5" fill="#607d8b">The PhaseAdjuster compensates downstream buffer depth up to that target; it cannot</text>
  <text x="100" y="604" font-size="11.5" fill="#607d8b">recover an overshoot. A runtime warning is logged when ramper + ALSA exceed it.</text>

  <rect x="70" y="610" width="18" height="18" rx="4" fill="#81c784"/>
  <text x="100" y="624" font-size="12.5" font-weight="700" fill="#1b5e20">RULE: StarvationRamperMinSize + AlsaBufferUs below the sender target</text>
  <text x="100" y="645" font-size="11.5" fill="#607d8b">Below the target the pipeline compensates (multiroom offset ~0); above it the receiver</text>
  <text x="100" y="662" font-size="11.5" fill="#607d8b">lags. Max ramper = 280 ms (configui), ALSA 5-50 ms; both senders covered.</text>

  <rect x="700" y="535" width="18" height="18" rx="4" fill="#ef9a9a"/>
  <text x="730" y="549" font-size="12.5" font-weight="700" fill="#37474f">UPSTREAM = free resilience</text>
  <text x="730" y="570" font-size="11.5" fill="#607d8b">Encoded Reservoir absorbs network cuts</text>
  <text x="730" y="587" font-size="11.5" fill="#607d8b">without adding latency.</text>

  <rect x="700" y="610" width="18" height="18" rx="4" fill="#7b1fa2"/>
  <text x="730" y="624" font-size="12.5" font-weight="700" fill="#7b1fa2">Measured (metronome) - inter room delay</text>
  <text x="730" y="645" font-size="11.5" fill="#607d8b">ramper 200ms: 62 ms offset - ramper 85ms +</text>
  <text x="730" y="662" font-size="11.5" fill="#607d8b">ALSA 12ms: ~5 ms offset (below audibility).</text>
</svg>
