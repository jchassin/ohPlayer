<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a6a8a"/>
    </marker>
    <linearGradient id="piGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9685b"/><stop offset="1" stop-color="#a94e42"/>
    </linearGradient>
    <linearGradient id="dacGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8ac9"/><stop offset="1" stop-color="#3d6aa0"/>
    </linearGradient>
    <linearGradient id="ampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a9b5b"/><stop offset="1" stop-color="#4c7a3f"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Setup 1 — Raspdac Mini / OLED with fixed-gain amplifier</text>

  <!-- Raspberry Pi -->
  <rect x="20" y="70" width="150" height="90" rx="8" fill="url(#piGrad)" stroke="#8a3d33"/>
  <text x="95" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Raspberry Pi 4</text>
  <text x="95" y="128" text-anchor="middle" font-size="11" fill="#eee">ohPlayer</text>
  <text x="95" y="145" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">volume = ALSA mixer</text>

  <!-- DAC -->
  <rect x="260" y="70" width="190" height="90" rx="8" fill="url(#dacGrad)" stroke="#2d5580"/>
  <text x="355" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Raspdac DAC</text>
  <text x="355" y="120" text-anchor="middle" font-size="11" fill="#eee">ES9038Q2M</text>
  <text x="355" y="140" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">Mini / OLED: encoder + display</text>

  <!-- Power amp -->
  <rect x="540" y="70" width="160" height="90" rx="8" fill="url(#ampGrad)" stroke="#3a5f30"/>
  <text x="620" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Power amplifier</text>
  <text x="620" y="125" text-anchor="middle" font-size="11" fill="#eee">fixed gain</text>

  <!-- Speakers -->
  <rect x="760" y="85" width="80" height="60" rx="6" fill="#777" stroke="#555"/>
  <text x="800" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Speakers</text>

  <!-- Arrows -->
  <line x1="170" y1="115" x2="258" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="103" text-anchor="middle" font-size="11" fill="#4a6a8a" font-weight="bold">I2S</text>
  <line x1="450" y1="115" x2="538" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="103" text-anchor="middle" font-size="11" fill="#4a6a8a" font-weight="bold">RCA</text>
  <line x1="700" y1="115" x2="758" y2="115" stroke="#4a6a8a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Settings note -->
  <rect x="20" y="180" width="820" height="44" rx="6" fill="#f5f8fa" stroke="#c8d4dc"/>
  <text x="35" y="197" font-size="11" font-weight="bold" fill="#2d5580">Web UI — Linn Amp tab:</text>
  <text x="35" y="214" font-size="11" fill="#333">Volume Control: “ALSA driver volume”  •  Serial Port: (empty)  •  Rotary encoder adjusts the DAC volume</text>
</svg>
